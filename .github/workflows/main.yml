name: Build & Release Windows Installer

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write # Required to create releases and upload assets

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetch all history for tagging

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 requests yt-dlp yt-dlp-ejs beautifulsoup4 instaloader pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller build.spec --clean

    - name: Verify EXE creation
      shell: pwsh
      run: |
        if (-Not (Test-Path "dist\OryvexDownloader\OryvexDownloader.exe")) {
          throw "EXE file not found!"
        }
        Write-Host "EXE created successfully."

    - name: Setup Inno Setup
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
      with:
        path: installer.iss

    - name: Compile Installer
      run: iscc installer.iss

    - name: Verify Installer creation
      shell: pwsh
      run: |
        $files = Get-ChildItem -Path "dist" -Filter "*.exe"
        if ($files.Count -eq 0) {
          throw "Installer exe not found in dist folder!"
        }
        Write-Host "Installer created: $($files[0].Name)"

    # --- RELEASE STEPS START HERE ---

    - name: Generate Tag Name
      id: tag
      run: |
        # If triggered by a tag, use it. Otherwise, create a nightly build tag based on date/commit
        if ("${{ github.ref }}" -like "refs/tags/*") {
          echo "name=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
        } else {
          $date = Get-Date -Format "yyyy.MM.dd"
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          echo "name=v$date-nightly-$shortSha" >> $env:GITHUB_OUTPUT
        }

    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.name }}
        name: Oryvex Downloader ${{ steps.tag.outputs.name }}
        body: |
          Automated build of Oryvex Media Downloader.
          
          **Changes:**
          - Auto-built from commit ${{ github.sha }}
          - Includes latest dependencies
        draft: false
        prerelease: false # Set to true if you want it marked as Pre-release
        generate_release_notes: true
        files: |
          dist/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
