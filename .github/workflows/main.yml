name: Build & Release Windows Installer

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 requests yt-dlp yt-dlp-ejs beautifulsoup4 instaloader pyinstaller

    # --- DOWNLOAD FFMPEG & DENO ---
    - name: Create Bundled Folder
      run: New-Item -ItemType Directory -Force -Path bundled

    - name: Download FFmpeg
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
        Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
        $ffmpegExe = Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
        if ($ffmpegExe) {
          Copy-Item $ffmpegExe.FullName -Destination "bundled\ffmpeg.exe"
          Write-Host "FFmpeg downloaded successfully."
        } else {
          throw "Could not find ffmpeg.exe in the extracted archive."
        }
        Remove-Item "ffmpeg.zip", "ffmpeg_extracted" -Recurse -Force

    - name: Download Deno
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "deno.zip"
        Expand-Archive -Path "deno.zip" -DestinationPath "bundled"
        if (Test-Path "bundled\deno.exe") {
          Write-Host "Deno downloaded successfully."
        } else {
          throw "deno.exe not found after extraction."
        }
        Remove-Item "deno.zip" -Force

    # --- BUILD EXE ---
    - name: Build EXE with PyInstaller
      run: |
        pyinstaller build.spec --clean

    # --- MANUALLY COPY BINARIES TO DIST ---
    - name: Copy Bundled Tools to Dist
      shell: pwsh
      run: |
        $distPath = "dist\OryvexDownloader"
        if (-Not (Test-Path $distPath)) {
          throw "Dist folder not found!"
        }
        Copy-Item "bundled\ffmpeg.exe" -Destination $distPath
        Copy-Item "bundled\deno.exe" -Destination $distPath
        Write-Host "Copied ffmpeg.exe and deno.exe to $distPath"

    - name: Verify Final Output
      shell: pwsh
      run: |
        $distPath = "dist\OryvexDownloader"
        if (-Not (Test-Path "$distPath\OryvexDownloader.exe")) {
          throw "OryvexDownloader.exe not found in $distPath"
        }
        if (-Not (Test-Path "$distPath\ffmpeg.exe")) {
          throw "ffmpeg.exe not found in $distPath"
        }
        if (-Not (Test-Path "$distPath\deno.exe")) {
          throw "deno.exe not found in $distPath"
        }
        Write-Host "Verification successful: EXE, ffmpeg, and deno are present."

    - name: Setup Inno Setup
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
      with:
        path: installer.iss

    - name: Compile Installer
      run: iscc installer.iss

    # --- RELEASE ---
    - name: Generate Tag Name
      id: tag
      shell: pwsh
      run: |
        if ("${{ github.ref }}" -like "refs/tags/*") {
          echo "name=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
        } else {
          $date = Get-Date -Format "yyyy.MM.dd"
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          echo "name=v$date-nightly-$shortSha" >> $env:GITHUB_OUTPUT
        }

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.name }}
        name: Oryvex Downloader ${{ steps.tag.outputs.name }}
        body: |
          Automated build of Oryvex Media Downloader.
          
          **What's included:**
          - FFmpeg (bundled — no separate install needed)
          - Deno JS Runtime (bundled — no separate install needed)
          - All Python dependencies
          
          Built from commit `${{ github.sha }}`
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          dist/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
