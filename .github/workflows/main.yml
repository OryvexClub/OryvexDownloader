name: Build & Release Windows Installer

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 requests yt-dlp yt-dlp-ejs beautifulsoup4 instaloader pyinstaller

    # --- DOWNLOAD FFMPEG & DENO ---
    - name: Download FFmpeg
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path bundled
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
        Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
        $ffmpegExe = Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
        Copy-Item $ffmpegExe.FullName -Destination "bundled\ffmpeg.exe"
        Remove-Item "ffmpeg.zip", "ffmpeg_extracted" -Recurse -Force
        Write-Host "FFmpeg downloaded: $(Get-Item bundled\ffmpeg.exe | Select-Object -ExpandProperty Length) bytes"

    - name: Download Deno
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "deno.zip"
        Expand-Archive -Path "deno.zip" -DestinationPath "bundled"
        Remove-Item "deno.zip" -Force
        Write-Host "Deno downloaded: $(Get-Item bundled\deno.exe | Select-Object -ExpandProperty Length) bytes"

    - name: Verify bundled tools
      shell: pwsh
      run: |
        if (-Not (Test-Path "bundled\ffmpeg.exe")) { throw "ffmpeg.exe not found!" }
        if (-Not (Test-Path "bundled\deno.exe")) { throw "deno.exe not found!" }
        Write-Host "All bundled tools ready."

    # --- BUILD ---
    - name: Build EXE with PyInstaller
      run: |
        pyinstaller build.spec --clean

    - name: Verify EXE creation
      shell: pwsh
      run: |
        if (-Not (Test-Path "dist\OryvexDownloader\OryvexDownloader.exe")) {
          throw "EXE file not found!"
        }
        if (-Not (Test-Path "dist\OryvexDownloader\ffmpeg.exe")) {
          throw "Bundled ffmpeg.exe not found in dist!"
        }
        if (-Not (Test-Path "dist\OryvexDownloader\deno.exe")) {
          throw "Bundled deno.exe not found in dist!"
        }
        Write-Host "EXE + bundled tools created successfully."

    - name: Setup Inno Setup
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
      with:
        path: installer.iss

    - name: Compile Installer
      run: iscc installer.iss

    # --- RELEASE ---
    - name: Generate Tag Name
      id: tag
      shell: pwsh
      run: |
        if ("${{ github.ref }}" -like "refs/tags/*") {
          echo "name=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
        } else {
          $date = Get-Date -Format "yyyy.MM.dd"
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          echo "name=v$date-nightly-$shortSha" >> $env:GITHUB_OUTPUT
        }

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.name }}
        name: Oryvex Downloader ${{ steps.tag.outputs.name }}
        body: |
          Automated build of Oryvex Media Downloader.
          
          **What's included:**
          - FFmpeg (bundled — no separate install needed)
          - Deno JS Runtime (bundled — no separate install needed)
          - All Python dependencies
          
          Built from commit `${{ github.sha }}`
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          dist/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
